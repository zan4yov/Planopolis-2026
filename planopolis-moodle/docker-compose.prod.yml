# Production overlay: HTTPS/HTTP front proxy, database tuning, log limits.
# Always use it together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (deploy.sh and manage.sh do this for you.)
services:
  db:
    # Tuned for a 4 GB VPS with up to ~200 concurrent participants.
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c synchronous_commit=off
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  moodle:
    # The base file publishes ${HTTP_PORT}:80. Set HTTP_PORT=127.0.0.1:8080 in .env
    # so this container is reachable only from the host, never from the internet.
    logging: *logging

  cron:
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      ACME_EMAIL: ${ADMIN_EMAIL:-panitia@example.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - moodle
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
