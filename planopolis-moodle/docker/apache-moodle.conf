<VirtualHost *:80>
    DocumentRoot /var/www/moodle/public
    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Moodle 5.1+ routing.
        FallbackResource /r.php
    </Directory>
    # Never serve files outside public/ (config.php lives one level up).
    <DirectoryMatch "^/var/www/moodle/(?!public)">
        Require all denied
    </DirectoryMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
