# Each Apache worker holds one PHP process and one database connection.
# 40 workers x ~100 MB of Moodle PHP fits a 4 GB VPS with room for PostgreSQL.
# Requests above this queue briefly instead of exhausting RAM or max_connections,
# which keeps the site slow-but-alive under a burst instead of crashing it.
<IfModule mpm_prefork_module>
    StartServers            8
    MinSpareServers         8
    MaxSpareServers        16
    MaxRequestWorkers      40
    MaxConnectionsPerChild 2000
</IfModule>
